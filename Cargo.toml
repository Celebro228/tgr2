[package]
name = "tgr2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Simple game engine for Rust"
repository = "https://github.com/Celebro228/tgr2"
documentation = "https://docs.rs/tgr2"
keywords = ["game-engine", "rust", "3d", "graphics"]
categories = ["game-development", "graphics", "rendering"]
authors = ["Argus"]

# Тесты
[[bin]]
name = "test"
path = "test/test.rs"


# Зависимости
[dependencies]
glam = "0.30.5"
hashbrown = "0.15.5"
miniquad = "0.4.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11.0"


# Режим для разработчиков
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3


# Режим для релиза
[profile.release]
lto = true
panic = "abort"
debug = false
opt-level = 3
overflow-checks = false
debug-assertions = false
incremental = false
rpath = false
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
